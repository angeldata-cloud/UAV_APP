name: 驗證題庫並部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載 Repository 內容
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-question-bank.txt

      - name: 安裝 Excel 解析套件
        run: python -m pip install -r requirements-question-bank.txt

      - name: 驗證 Excel 並建立 questions.json
        run: python scripts/build_question_bank.py

      - name: 測試 Excel 轉換規則
        run: python -m unittest scripts/build_question_bank_test.py

      - name: 設定 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝 App 套件
        run: pnpm install --frozen-lockfile

      - name: 執行 App tests
        run: pnpm test

      - name: 建立 production App
        run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: 保存自動產生的題庫與 stable ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/questions.json data/question-id-map.json data/question-bank-report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自動更新 App 題庫"
            git push
          fi

      - name: 上傳 GitHub Pages 成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
